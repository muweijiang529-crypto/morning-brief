name: Update news
on:
  schedule:
    # Backup only: GitHub often delays or skips these. A reliable outside timer calls workflow_dispatch.
    - cron: '13 9,10,11 * * *'
    - cron: '37 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch_feeds.py', '.github/workflows/feeds.yml']
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Collect, translate and build the brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_feeds.py out
      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git commit -qm "News data"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
