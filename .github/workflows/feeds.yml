name: Update news feeds
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/fetch_feeds.py', '.github/workflows/feeds.yml']
permissions:
  contents: write
concurrency:
  group: feeds
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_feeds.py
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add feeds.json
          git diff --cached --quiet || (git commit -m "Update feeds" && git pull --rebase origin main && git push)
